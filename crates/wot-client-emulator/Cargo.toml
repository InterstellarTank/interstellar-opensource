[package]
name = "wot-client-emulator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bw201 = { path = "../bw201" }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
hex = "0.4"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
wot-baseapp = { path = "../wot-baseapp" }
wot-battle = { path = "../wot-battle" }
wot065-data = { path = "../wot065-data" }
