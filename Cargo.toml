[workspace]
members = ["crates/bw201", "crates/wot-baseapp", "crates/wot065-data", "crates/wot-battle", "crates/wot-client-emulator"]
exclude = ["vendor/wg-toolkit-rs"]
resolver = "2"

[package]
name = "wot-server"
version = "0.1.0"
edition = "2021"

[dependencies]
bw201 = { path = "crates/bw201" }
wot065-data = { path = "crates/wot065-data" }
wg-toolkit = { path = "vendor/wg-toolkit-rs/wg-toolkit" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
blowfish = "0.9"
cipher = "0.4"
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3


